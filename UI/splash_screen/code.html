<style>
        .material-symbols-outlined {

        }

        .liquid-glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid #2D2D2D;
        }

        @keyframes drawIn {
            to { stroke-dashoffset: 0; }
        }

        .draw-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawIn 3s ease-out forwards;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .floating {
            animation: float 4s ease-in-out infinite;
        }

        .floating-delayed {
            animation: float 4.5s ease-in-out infinite 0.5s;
        }

        .stagger-1 { animation-delay: 0.2s; }
        .stagger-2 { animation-delay: 0.4s; }
        .stagger-3 { animation-delay: 0.6s; }

<body class="bg-background text-on-background min-h-screen flex flex-overflow-hidden items-center justify-center relative overflow-hidden">
<!-- Splash Background Gradient -->

</div>

</div>

</div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-20 flex flex-col items-center justify-between h-full py-xl px-container-margin text-center">
<!-- Top Space Filler -->

<!-- Center Branding & Illustration Area -->

<!-- Hand-drawn style Headphone Illustration -->
<svg class="w-full h-full drop-shadow-xl" fill="none" stroke="currentColor" viewbox="0 0 200 200">
<!-- Headband -->
<path class="draw-path text-on-surface" d="M40 100 C 40 40, 160 40, 160 100" stroke-linecap="round" stroke-width="2.5"></path>
<!-- Left Ear Cup -->
<rect class="draw-path text-primary fill-primary-container" height="50" rx="15" stroke="currentColor" stroke-width="2" width="30" x="30" y="90"></rect>
<!-- Right Ear Cup -->
<rect class="draw-path text-primary fill-primary-container" height="50" rx="15" stroke="currentColor" stroke-width="2" width="30" x="140" y="90"></rect>
<!-- Connecting Scribbles -->
<path class="draw-path text-outline stagger-1" d="M70 45 Q 100 20, 130 45" stroke-dasharray="4 4" stroke-width="1"></path>
</svg>
<!-- Floating Music Notes Around Illustration -->
<div class="absolute -top-4 -right-2 floating stagger-1">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">music_note</span>

</div>

                    LMusic
                </h1>
<div class="w-12 h-1 bg-primary rounded-full stagger-2"></div>
</div>

            </p>
<!-- Minimal Hand-drawn Loading Scrubber -->
<div class="w-32 h-1 bg-surface-container-highest rounded-full overflow-hidden relative">
<div class="absolute inset-y-0 left-0 bg-primary w-0 transition-all duration-1000 ease-in-out" id="loading-bar"></div>
</div>

<!-- Interactive Scribble/Particle Effect Layer -->
<canvas class="fixed inset-0 z-15 pointer-events-none" id="canvas-scribbles"></canvas>
<script>
        // Simulate Splash Screen Duration and Progress
        document.addEventListener('DOMContentLoaded', () => {
            const loadingBar = document.getElementById('loading-bar');
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    // In a real app, we would redirect here
                    console.log('Splash sequence complete');
                }
                loadingBar.style.width = `${progress}%`;
            }, 300);
        });

        // Lightweight atmospheric "scribble" background effect
        const canvas = document.getElementById('canvas-scribbles');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        const dots = [];
        for (let i = 0; i < 15; i++) {
            dots.push({
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                size: Math.random() * 2 + 1
            });
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#7a573e22'; // Primary color with very low opacity
            
            dots.forEach(dot => {
                dot.x += dot.vx;
                dot.y += dot.vy;

                if (dot.x < 0 || dot.x > width) dot.vx *= -1;
                if (dot.y < 0 || dot.y > height) dot.vy *= -1;

                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dot.size, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }
        animate();
    </script>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
