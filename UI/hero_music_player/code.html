<script>
        // Generate Waveform Bars
        const waveform = document.getElementById('waveform');
        const barCount = 40;
        
        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement('div');
            bar.className = 'waveform-bar';
            const randomHeight = Math.floor(Math.random() * 32) + 8;
            bar.style.height = `${randomHeight}px`;
            
            // Random animation delay for pulsing effect
            const delay = Math.random() * 2;
            const duration = 0.5 + Math.random();
            bar.style.animation = `pulse-wave ${duration}s ease-in-out ${delay}s infinite`;
            
            waveform.appendChild(bar);
        }

        // Particle Effect
        const createParticle = () => {
            const particle = document.createElement('div');
            const size = Math.random() * 4 + 2;
            particle.className = 'fixed bg-primary/10 rounded-full pointer-events-none z-0';
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.top = `${Math.random() * 100}vh`;
            document.body.appendChild(particle);

            const duration = Math.random() * 10 + 5;
            particle.animate([
                { opacity: 0, transform: 'translateY(0) scale(1)' },
                { opacity: 0.5, transform: `translateY(-50px) scale(1.5)` },
                { opacity: 0, transform: `translateY(-100px) scale(1)` }
            ], {
                duration: duration * 1000,
                easing: 'ease-in-out',
                iterations: Infinity
            });

            setTimeout(() => {
                particle.remove();
            }, duration * 1000);
        };

        setInterval(createParticle, 2000);
    </script>
